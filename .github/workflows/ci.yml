name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  # Windows runners default to cp1252; the test steps print non-ASCII status marks
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint mypy
      
      - name: Run Black formatter check
        run: |
          black --check --diff python/
        continue-on-error: true
      
      - name: Run Flake8
        run: |
          flake8 python/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 python/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        continue-on-error: true
      
      - name: Run Pylint
        run: |
          pylint python/helpers/ --exit-zero --max-line-length=100
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
      
      - name: Test package import
        run: |
          python -c "from helpers.toga_personality import initialize_toga_personality; print('✓ Package import successful')"
        working-directory: python

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install coverage pytest pytest-cov
      
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report -m
          coverage xml
      
      - name: Generate coverage badge
        run: |
          coverage report --format=total > coverage.txt
          echo "Coverage: $(cat coverage.txt)%"
      
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.txt

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Toga's lines come from a real model: serve a small one locally for the examples
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: qwen2.5-0.5b-instruct-q4_k_m

      - name: Serve local language model
        run: |
          pip install 'llama-cpp-python[server]==0.3.36' \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          mkdir -p models
          [ -f models/qwen2.5-0.5b-instruct-q4_k_m.gguf ] || curl -fsSL -o models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          nohup python -m llama_cpp.server --model models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            --model_alias qwen2.5-0.5b-instruct --host 127.0.0.1 --port 8080 --n_ctx 4096 > llama-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/v1/models && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/v1/models || (cat llama-server.log; exit 1)
          echo "TOGAI_LLM_BASE_URL=http://127.0.0.1:8080/v1" >> "$GITHUB_ENV"
          echo "TOGAI_LLM_MODEL=qwen2.5-0.5b-instruct" >> "$GITHUB_ENV"

      - name: Run model-backed unit tests
        run: |
          python -m unittest tests.test_toga_personality tests.test_toga_emotional_intelligence

      - name: Run demo script
        run: |
          echo "n" | python python/examples/demo_toga.py
      
      - name: Run integration example
        run: |
          python python/examples/integration_example.py
      
      - name: Run benchmarks
        run: |
          timeout 60 python python/examples/benchmark_toga.py || true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: |
          bandit -r python/ -f json -o bandit-report.json || true
          bandit -r python/ || true
        continue-on-error: true
      
      - name: Run Safety check
        run: |
          safety check --json || true
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json
        if: always()

  build-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: |
          python -m build
      
      - name: Check package
        run: |
          twine check dist/*
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 30

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, test-coverage, integration-tests, security-scan, build-package]
    if: always()
    
    steps:
      - name: Check CI status
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All CI checks completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Linting: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Coverage: ${{ needs.test-coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Package Build: ${{ needs.build-package.result }}" >> $GITHUB_STEP_SUMMARY
